# Prometheus Configuration for AutoUGC Production & Local Infrastructure
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "autougc-saas"
    metrics_path: "/api/metrics"
    scheme: "http"
    static_configs:
      - targets: ["app:3000"]
        labels:
          app: "autougc"
          environment: "production"
          service: "web"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
