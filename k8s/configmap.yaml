apiVersion: v1
kind: ConfigMap
metadata:
  name: autougc-config
  namespace: autougc-production
  labels:
    app.kubernetes.io/name: autougc
    app.kubernetes.io/component: web
    environment: production
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_APP_URL: "https://autougc.com"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_placeholder"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_live_placeholder"
  NEXT_PUBLIC_POSTHOG_KEY: "phc_live_placeholder"
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  NEXT_PUBLIC_SENTRY_DSN: "https://examplePublicKey@o0.ingest.sentry.io/0"
  SENTRY_ENVIRONMENT: "production"
  DATADOG_AGENT_HOST: "datadog-agent.monitoring.svc.cluster.local"
  DATADOG_AGENT_PORT: "8125"
