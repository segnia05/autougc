apiVersion: v1
kind: Service
metadata:
  name: autougc-service
  namespace: autougc-production
  labels:
    app.kubernetes.io/name: autougc
    app.kubernetes.io/component: web
    environment: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autougc
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
