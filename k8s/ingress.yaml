apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autougc-ingress
  namespace: autougc-production
  labels:
    app.kubernetes.io/name: autougc
    environment: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - autougc.com
        - www.autougc.com
      secretName: autougc-tls-cert
  rules:
    - host: autougc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autougc-service
                port:
                  number: 80
    - host: www.autougc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autougc-service
                port:
                  number: 80
